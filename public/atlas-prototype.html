<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="cache-control" content="no-store">
  <title>Retirement Atlas moved</title>
  <script>
    const destination = new URL("./atlas.html", document.baseURI);
    destination.search = location.search;
    destination.hash = location.hash;
    location.replace(destination);
  </script>
</head>
<body>
  <p>The Atlas visual explorer now lives inside <a id="atlas-link" href="./atlas.html">Command Centre → Scenario → Explore</a>.</p>
  <script>
    const link = document.getElementById("atlas-link");
    link.href = `./atlas.html${location.search}${location.hash}`;
  </script>
</body>
</html>
