name: Visual regression

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VISUAL_QA_MODULES: /tmp/retirement-visual-tools

    steps:
      - name: Check out pull-request head
        uses: actions/checkout@v4

      - name: Check out main baseline
        uses: actions/checkout@v4
        with:
          ref: main
          path: visual-base

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Build pull-request site
        run: |
          npm ci
          npm run build:pages

      - name: Build baseline site
        working-directory: visual-base
        run: |
          npm ci
          npm run build:pages

      - name: Install isolated visual QA tooling
        shell: bash
        run: |
          mkdir -p "$VISUAL_QA_MODULES"
          npm install --prefix "$VISUAL_QA_MODULES" --package-lock=false --no-save --no-audit --no-fund \
            playwright@1.49.1 pixelmatch@5.3.0 pngjs@7.0.0
          "$VISUAL_QA_MODULES/node_modules/.bin/playwright" install --with-deps chromium

      - name: Start both local previews
        shell: bash
        run: |
          npm run preview:pages -- --host 127.0.0.1 --port 4173 >"$RUNNER_TEMP/retirement-head.log" 2>&1 &
          (cd visual-base && npm run preview:pages -- --host 127.0.0.1 --port 4174) >"$RUNNER_TEMP/retirement-base.log" 2>&1 &
          for port in 4173 4174; do
            for attempt in {1..40}; do
              if curl -fsS "http://127.0.0.1:$port/retirement/" >/dev/null; then break; fi
              sleep 0.5
            done
            curl -fsS "http://127.0.0.1:$port/retirement/" >/dev/null
          done

      - name: Capture baseline
        run: node tools/visual-regression/capture.cjs --base-url http://127.0.0.1:4174 --out visual-artifacts/baseline --label base

      - name: Capture pull-request version
        run: node tools/visual-regression/capture.cjs --base-url http://127.0.0.1:4173 --out visual-artifacts/current --label current

      - name: Compare rendered surfaces
        run: node tools/visual-regression/compare.cjs --baseline visual-artifacts/baseline --current visual-artifacts/current --report visual-artifacts/report

      - name: Publish visual summary
        if: always()
        shell: bash
        run: |
          if [ -f visual-artifacts/report/summary.md ]; then
            cat visual-artifacts/report/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retirement-visual-report
          path: visual-artifacts/report
          if-no-files-found: warn
          retention-days: 14
