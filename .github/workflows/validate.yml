name: Validate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Restore Chromium for browser tests
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: retirement-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium for browser tests
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npm exec -- playwright install --only-shell chromium
      - run: npm run test:browser
