name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build and test static site
        run: npm test

      - name: Restore Chromium for browser tests
        id: chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: retirement-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium for browser tests
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npm exec -- playwright install --only-shell chromium

      - name: Run browser journeys on the Pages artifact
        run: npm run test:browser

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
